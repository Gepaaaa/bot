# fly.toml app configuration file for GepaBot (WhatsApp Baileys Engine + Dashboard)

app = 'bot--ztdpa'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  DATA_DIR = '/data'

# Persistent storage so .baileys_auth (WhatsApp session) survives machine restarts & deploys
[mounts]
  source = 'gepabot_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  # CRITICAL: Disable auto-stop so Fly.io never shuts down & wipes the WhatsApp session after 5 mins!
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
