# fly.toml app configuration file for GepaBot (WhatsApp Baileys Engine + Dashboard)

app = 'bot--ztdpa'
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  # Keep machine awake 24/7 so WhatsApp Baileys WebSocket stays connected
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
